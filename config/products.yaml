# Product classification table.
#
# Built from the live QuickBooks Product/Service list (123 items, pulled 2026-11-17).
# Match order for every invoice/sales-receipt line:
#   1. qbo_item_id   (most stable; add these once you see them in `hunter-retention audit-items`)
#   2. name          exact QBO item Name (case/space-insensitive, "(deleted)" suffix ignored)
#   3. name_regex    regex on the normalized item name
# Anything that matches nothing is UNCLASSIFIED: never emailed, sent to the review queue.
#
# family: micro_metallizer | carbitron | micro_jet
# role:   equipment   core system / kit / power supply (drives onboarding)
#         consumable  used up and reordered (pens, electrodes, nozzles, media)
#         prep        surface-prep pens
#         accessory   cables, hand pieces, fittings, spare parts
# application (Micro-Metallizer only): gold | nickel | tin | silver | copper | other
# url: verified page on hunterproducts.com (pulled 2026-11-17). Leave blank if no page exists.

families:
  micro_metallizer:
    label: "Micro-Metallizer"
    system_url: "https://hunterproducts.com/systems/micro-metallizer/"
    store_url: "https://hunterproducts.com/store/?line=micro-metallizer"
  carbitron:
    label: "Carbitron 300"
    system_url: "https://hunterproducts.com/systems/carbitron-300/"
    store_url: "https://hunterproducts.com/store/?line=carbitron"
  micro_jet:
    label: "Micro-Jet 200"
    system_url: "https://hunterproducts.com/systems/micro-jet-200/"
    store_url: "https://hunterproducts.com/store/?line=micro-jet"

# Lines that are not products. Ignored for classification; an order made only of these is not a purchase.
non_product:
  names: [SHIPPING, SHIIPPING, SHIPPING1, DISCOUNT, DISCOUNTS, BANK CHARGES, BANK FEES, RM TARIFFS,
          SURCHARGE, TARIFF SURCHARGE, LATE FEE, CREDIT, SERVICES, DUTIES AND TAXES,
          "PMNTDISCOUNT_402 - DISCOUNTS", "PMNTDISCOUNT_713 - BANK CHARGES"]
  name_regex: ["^NJ SALES TAX.*", "^CA\\b.*", "^OUT OF STATE$", "^SALES TAX.*", "^-$"]

# Real products that are outside this program (legacy lines). Not emailed, not flagged.
ignored:
  names: ["M.5", "M.7", "M.9", "M8A", "M8B", "M.8A", "MT6004", "MT6004 - 4", "MT6008", "MT6009", "AC-12",
          "PL-1003-1", "PL-1003A", "PL1002", "PL1007"]

