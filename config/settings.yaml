# Program settings. Secrets are NOT here; they come from environment variables (see docs/SETUP.md).

# dry_run : sync + plan + render, log what would be sent. No Apollo writes. (default)
# sandbox : real Apollo enrollments, but every email goes to sandbox.redirect_to, subject tagged [TEST ...]
# live    : real customer emails. ALSO requires HP_ALLOW_LIVE_SEND=true AND `approve-production`.
mode: live

timezone: America/New_York

# Only customers whose FIRST qualifying purchase is on/after this date enter the program.
# Set to the go-live date. Setting it earlier "catches up" recent buyers: touches whose
# window has already closed are skipped automatically, later ones still send.
program_start_date: 2026-12-01

# Backfill depth for purchase history (first-time detection checks everything since this date).
history_start_date: 2000-01-01

qbo:
  environment: production      # production | sandbox
  minor_version: 75

apollo:
  # hunter@hunterproducts.com (Microsoft Exchange) - existing customers get the main domain, not the cold .co domain
  send_from_email_account_id: "69b4578fbbbdb70011b7044a"
  # One-step sequences, step 1 = automatic email, wait 0 days, subject {{contact.hp_subject}}, body {{contact.hp_body}}.
  # Created 2026-11-20, named "HP Lifecycle E1..E4 / R1..R3 (hunter@)" in Apollo.
  sequences:
    e1: "6b00b1af5b7c0100109da430"
    e2: "6b00b1b0ebe694001487bf55"
    e3: "6b00b1b070587c000c5a12fb"
    e4: "6b00b1b1200376001023110e"
    r1: "6b00b1b2ebe6940018773516"       # reorder flow, same one-step setup
    r2: "6b00b1b272cefe0013206417"
    r3: "6b00b1b3f4d064000cc4ba67"
  # Spare one-step sequences, identical to the ones above. Apollo sends a contact each sequence only once,
  # so every email goes through a sequence that person has not used yet. 15 in total = 15 emails per person.
  # The daily job warns when anyone gets within pool_low_warning of the end; add more ids here when it does.
  sequence_pool:
    - "6b0485cb23868c000c051078"
    - "6b0485cbc9a75f001457e4d0"
    - "6b0485cc475f910018ab9c18"
    - "6b0485cd8e248e0014dcf58d"
    - "6b0485ce8e248e001004296b"
    - "6b0485cedad82f000cc2e677"
    - "6b0485cf23868c000c05109f"
    - "6b0485cf8e248e000c15da8e"
  pool_low_warning: 3
  contact_label: "HP Lifecycle"
  # text: hp_body is a multi-line text field inserted as-is. html: paragraphs converted to <p>/<br>.
  # Confirm which renders correctly with your first sandbox send (docs/SETUP.md step 6).
  body_format: text
  # Never enroll someone currently active in another sequence (Tier A Reactivation, TTM, Technoprobe, ...).
  skip_if_active_in_other_sequences: true

sender:
  name: "Brandon"
  title: "Vice President"
  company: "Hunter Products, Inc."
  address: "36 Madison Avenue, Flemington, NJ 08822"
  phone: "(908) 526-8440"
  website: "https://www.hunterproducts.com"

identity:
  # A "new" QBO customer whose company email domain already bought from us:
  #   review   -> hold for a human decision (default)
  #   existing -> treat as an existing account, no first-time sequence
  #   ignore   -> treat as a new customer
  domain_match_policy: review
  # Billing/AP inboxes. If these are the only address we have, hold for review instead of emailing AP.
  role_email_policy: review      # review | send
  # Regexes (full match) on the part before "@". Real QBO examples: aesculap_ap@, apforestgrove@.
  # Kept to finance/system inboxes: at small shops purchasing@ / info@ / orders@ are often the actual
  # buyer, so they are NOT listed by default.
  role_address_patterns: ["(.*[._-])?a[._-]?p([._-].*)?", "ap(forest|grove|plant|site|dept|team|inbox|mail|[0-9])[a-z0-9]*",
                          ".*accounts?[._-]?payable.*", ".*payables?.*", ".*invoic(e|es|ing).*", ".*billing.*",
                          ".*accounting.*", ".*accounts?[._-]?receivable.*", "(.*[._-])?ar([._-].*)?",
                          ".*receiving.*", ".*finance.*", "no[._-]?reply.*", "do[._-]?not[._-]?reply.*",
                          ".*remit.*", ".*supplier.*", ".*vendor.*", ".*data[._-]?request.*", ".*notification.*"]
  freemail_domains: [gmail.com, yahoo.com, hotmail.com, outlook.com, aol.com, icloud.com, live.com, msn.com,
                     comcast.net, verizon.net, att.net, me.com, protonmail.com, ymail.com, qq.com, 163.com]

# Contact lookup: who to email at each new customer, and what kind of contact they are.
# Order tried: QuickBooks emails, our Outlook history, the PO email, shipping-label name via Apollo,
# then an Apollo engineer search for larger orders. See src/hunter_retention/contacts.py.
contacts:
  enabled: true
  auto_threshold: 65            # score (0-100) a found contact needs to be used without a human look
  monthly_credit_cap: 25        # most Apollo credits the lookup may spend per calendar month
  credit_modes: [live]          # Apollo lookups only run in these modes; dry_run and sandbox spend nothing
  apollo_search_min_order: 1000 # engineer search only for first orders at or above this amount
  inbox_lookback_days: 730
  retry_days: 30                # accounts with no contact are looked up again this often
  mailboxes: ["hunter@hunterproducts.com", "sales@hunterproducts.com"]
  own_domains: [hunterproducts.com, hunterproducts.co]

# Reorder flow: existing customers who are taking longer than usual to reorder.
reorder:
  enabled: true
  start_date: "2026-11-24"          # no reorder emails are planned before this date
  min_orders: 3                     # need at least this many purchases to know a customer's rhythm
  recent_gaps: 6                    # usual gap = median of this many most recent gaps
  min_usual_gap_days: 21
  max_usual_gap_days: 400           # customers who order less often than this are left alone
  # A customer enters the flow the day: days since last order > usual gap x trigger_multiple + trigger_extra_days.
  # Examples: 1.3 and 0 = 30% later than usual.  1.0 and 60 = two months later than usual.
  trigger_multiple: 1.3
  trigger_extra_days: 0
  gap_basis: median                 # median = middle of their recent gaps (steadier); last = only their last gap
  long_gone_multiple: 3.0           # beyond this it is a win-back: flagged for you, not automated
  long_gone_days: 540               # ...and so is anyone who has not ordered in this many days
  dormant_days: 730                 # no order in this long: left alone, not even flagged
  irregular_cv: 1.0                 # order timing more uneven than this is flagged, not automated
  exclude_domains: []               # customers handled by other outreach, e.g. [ttmtech.com]
  exclude_accounts: []

eligibility:
  min_order_amount: 0.01                 # $0 sample shipments are not purchases
  ignored_products_count_as_history: true
  refund_window_days: 120
  full_refund_threshold: 0.9             # credit >= 90% of the order within the window = refunded/canceled
  # Accounts that spent this much in the last 12 months get NO automated emails from either flow.
  # Counted per company: QuickBooks customers sharing an email domain (e.g. TTM's plants) are added together.
  # They go on the review list for a personal note instead. 0 turns the rule off.
  no_automation_min_revenue_12m: 10000
  min_days_between_emails: 7
  max_emails_per_30_days: 2
  pause_on_reply: true                   # a reply hands the customer to a human; remaining touches stop
  require_engagement_sync: true          # if Apollo status can't be read, don't send blind

dispatch:
  max_attempts: 3
  max_sends_per_day: 25       # across all runs that day
  launch:                     # gentler cap for the first week; lifts by itself on this date
    until: "2026-12-08"
    max_sends_per_day: 5
  engagement_lookback_days: 150
  recall_window_hours: 72

sandbox:
  redirect_to: "hunter@hunterproducts.com"
  max_per_run: 5

analytics:
  # % of new customers randomly held out (no emails) so revenue lift can be measured honestly.
  # Set to 0 to email everyone.
  holdout_pct: 0
