# Lot registry. One entry per inbound shipment of plating pens.
#
# A lot number goes on a Certificate of Conformance, so every field here has to be true and backed by
# paperwork you keep. The registration emails use a lot ONLY when:
#   1. it is listed here with a use_by date and a certificate document, and
#   2. the order is tied to it, either because the code is written on the QuickBooks order
#      (pen line description, e.g. "24K Gold Pen  Lot HP-2611-G24", or a custom field named "Lot"),
#      or because it was the only lot of that pen in stock on the day the order shipped (ships_from below).
# Otherwise the registration is held for a person and nothing is sent. A lot is never guessed.
#
# Fields
#   code      your lot number for this shipment. Letters, digits and dashes.
#   skus      the items that arrived in this shipment (QuickBooks SKUs). Leave empty to allow any pen.
#   received  the day the shipment was received and put into stock.
#   ships_from   first day orders ship from this lot. With this set, an order that ships while this is
#                the ONLY lot of that pen in stock gets this lot automatically, nothing to type on invoices.
#   ships_until  last day orders shipped from this lot. Leave empty while it is the lot on the shelf.
#                Fill it in when the lot runs out and the next one starts.
#                If two lots of the same pen are in stock on a day, orders from that day are held.
#   made      date of manufacture (DOM), as stated by the supplier.
#   use_by    the last day these pens should be used.
#   coc_url   link to the Certificate of Conformance for this lot (a PDF you issued and can stand behind).
#   note      internal only, never sent to customers (your receiving paperwork reference).
#
# Example (remove the leading # and fill in real values):
#   - code: "HP-2611-G24"
#     skus: ["PL-1003"]
#     received: 2026-11-11
#     use_by: 2027-11-11
#     coc_url: "https://hunterproducts.com/coc/HP-2611-G24.pdf"
#     note: ""

# ---------------------------------------------------------------------------------------------------
# Lots L20261020xx: pens in stock in November 2026.
# Basis (Brandon Russo, 2026-11-27): the supplier told Hunter these pens were made on 10/20/2026.
# Use-by is 12 months after manufacture. Lot code = L + manufacture date + last two digits of the part number.
# ships_from 2026-11-27: on that day Brandon stated every pen in stock is from this batch, so orders
# shipping from then on are from these lots. Orders shipped earlier are not covered and are held.
# coc_url is empty until the signed certificate for each lot is published. Until then a registration
# for one of these lots is held, not sent.
