# Email copy. Jinja2 templates rendered with the customer's real purchase data.
#
# RULES
#  * Anything not confirmed by Hunter Products is written as [[VERIFY: ...]].
#    Live sending of an email that still contains a VERIFY marker is BLOCKED automatically.
#    Run `hunter-retention content-lint` to list what's left.
#  * Part numbers and links below come from the QuickBooks item list and hunterproducts.com (Nov 2026).
#  * No em dashes, no jewelry references, no "made in NJ", no SDS/spec sheet citations.
#  * Never say the order "arrived": QuickBooks has no delivery confirmation.
#
# Variables: greeting, first_name, company, product, product_sku, product_url, products, consumables,
#   application_labels, family_label, system_url, store_url, quote_url, tech_url, resources_url,
#   guides_url, sender_name, sender_title, sender_company, sender_address, sender_phone, blocks (rendered tip blocks),
#   po_number, contact_role, family
#
# CONTACT TYPES
#  The contact lookup tags each person as user, buyer, owner_operator or unknown.
#   * user and unknown get the standard emails under `tracks:`.
#   * buyer and owner_operator get the versions under `role_variants:` where one exists,
#     otherwise the standard email. `skip: true` means that contact type does not get that email.
#   * To override one product line only, add `variants: {buyer: {subject:, body:}}` under that email.

greeting_fallback: "Hello,"
max_application_blocks: 2

links:
  quote: "https://hunterproducts.com/contact/#quote"
  technical: "https://hunterproducts.com/contact/?topic=technical#quote"
  resources: "https://hunterproducts.com/resources/"
  guides: "https://hunterproducts.com/guides/"

tracks:
  # ===================================================================== A: Micro-Metallizer
  A:
    e1:
      subject: "Getting started with your {{ product_ref }}"
      body: |
        {{ greeting }}

        Thanks again for ordering the {{ product_ref }}. I wanted to check in as you get started.

        If anything about setup, surface prep or technique isn't clear, let us know and we can help out.

        Product page: {{ product_url }}
        Brush plating guides: {{ guides_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e2:
      subject: "One month in with your {{ product_ref }}"
      body: |
        {{ greeting }}

        It's been about a month since you ordered the {{ product_ref }}.

        {% if consumables %}
        Here's what you ordered, in case you need more:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}
        {% else %}
        If you need more pens, they're here: {{ store_url }}
        {% endif %}

        Questions on a specific part or substrate? Reply here, or send details through this form: {{ tech_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}

    e3:
      subject: "Restocking your plating pens"
      body: |
        {{ greeting }}

        It's been a couple of months since your first order, so I wanted to make reordering easy for when you need it.

        {% if consumables %}
        From your original order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}
        {% endif %}

        Reply with quantities and a PO number and it ships the same or next business day.

        Order online: {{ store_url }}
        Need a quote first: {{ quote_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up and see how things have been going with the {{ product_ref }}.

        Have you been getting the results you were looking for?

        If there's anything we can help with, whether it's technique, replacement pens, or a different plating application, just reply and I'll take care of it.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}

  # ===================================================================== B: Carbitron 300
  B:
    e1:
      subject: "Getting set up with your Carbitron 300"
      body: |
        {{ greeting }}

        Thanks again for ordering the Carbitron 300. I wanted to check in as you get it set up.

        Have you had a chance to run it on a part yet? If anything about setup or operation isn't clear, reply here and tell me what tool or surface you're coating. I'll point you in the right direction.

        System overview: {{ system_url }}
        Documentation: {{ resources_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e2:
      subject: "How is the Carbitron 300 working out?"
      body: |
        {{ greeting }}

        It's been about a month since your Carbitron 300 arrived. Have you had success with it so far?

        If you're running low on carbide, replacement electrodes are here: {{ store_url }}

        Or just reply with what you need and I'll get it out to you.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}

    e3:
      subject: "Carbitron 300 electrodes and parts"
      body: |
        {{ greeting }}

        It's been a couple of months with the Carbitron 300, so here's the reorder info in one place.

        {% if consumables %}
        Electrodes from your original order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }})

        {% endfor %}
        {% endif %}
        Replacement parts we stock:
        - Vibrator Hand Piece (TS3042), or with power cable (TS3053)
        - Power Cable, red (TS3045)
        - Ground Cable, black (TS3046)

        Reply with what you need and a PO number and it ships the same or next business day.

        Order online: {{ store_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up on the Carbitron 300. How has it been performing for you?

        If you've run into anything, or you're coating something new and want a second opinion on electrodes or setup, just reply. Happy to help.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}

  # ===================================================================== C: Micro-Jet 200
  C:
    e1:
      subject: "Getting set up with your Micro-Jet 200"
      body: |
        {{ greeting }}

        Thanks again for ordering the Micro-Jet 200. I wanted to check in as you get it set up.

        Have you had a chance to run it yet? If anything about setup, air supply or media isn't clear, reply here and tell me what you're blasting. I'll point you in the right direction.

        System overview: {{ system_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e3:
      subject: "Micro-Jet 200 nozzles and media"
      body: |
        {{ greeting }}

        It's been a couple of months since you started with the Micro-Jet 200, so here's the reorder info in one place.

        {% if consumables %}
        From your original order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }})

        {% endfor %}
        {% endif %}
        Tungsten carbide nozzles: .020" (AB2003) and .030" (AB2004)
        Nozzle assemblies: .020" (AB2001) and .030" (AB2002)

        Reply with what you need and a PO number and it ships the same or next business day.

        Order online: {{ store_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up on the Micro-Jet 200. How has it been working for you?

        If you've hit any issues, or you're trying a new media or part, just reply. Happy to help.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}

  # ===================================================================== D: Consumables / parts only
  D:
    e1:
      subject: "Your Hunter Products order"
      body: |
        {{ greeting }}

        Thanks for your order of the {{ product }}. One quick question so I can be more useful: what are you using your {{ family_label }} for, and roughly how long has it been in service?

        If you need anything for it, whether that's parts, technique help or a quote, just reply here.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e3:
      subject: "Restocking {{ family_label }} supplies"
      body: |
        {{ greeting }}

        It's been a couple of months since your order, so I wanted to make the next one easy.

        {% if consumables %}
        From your order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}
        {% endif %}

        Reply with quantities and a PO number and it ships the same or next business day.

        Order online: {{ store_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up and see how things are going with your {{ family_label }} work.

        If there's anything we can help with, parts, technique, or something new you're working on, just reply and I'll take care of it.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}

  # ===================================================================== R: reorder flow (existing customers)
  # Sent when a repeat customer goes longer than usual without ordering. Stops the moment they order.
  R:
    r1:
      subject: "Running low on {{ family_label }} supplies?"
      body: |
        {{ greeting }}

        It's been a while since your last order in {{ last_order_month }}, so I wanted to check that you're not running low.

        {% if consumables %}
        Last time you ordered:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}
        {% endif %}

        Reply with quantities and a PO number and it ships the same or next business day.

        Order online: {{ store_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}
      variants:
        buyer:
          subject: "Reorder check for {{ company or 'your team' }}{% if po_number %} (last PO {{ po_number }}){% endif %}"
          body: |
            {{ greeting }}

            {{ company or "Your team" }}'s last order with us was {{ last_order_date }}{% if po_number %} on PO {{ po_number }}{% endif %}. In case stock is getting low, here is what was on it:

            {% for c in consumables %}
            - {{ c.qty | int }} x {{ c.display }} ({{ c.sku }})
            {% endfor %}

            Reply with quantities and a PO and it ships the same or next business day.

            Need a quote first: {{ quote_url }}

            Best,
            {{ sender_name }}
            {{ sender_company }}
            {{ sender_address }}
            {{ sender_phone }}

    r2:
      subject: "Following up on {{ family_label }} supplies"
      body: |
        {{ greeting }}

        Following up on my note from a couple of weeks ago in case it got buried. Do you need anything restocked?

        {% if consumables %}
        From your last order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }})
        {% endfor %}
        {% endif %}

        A one-line reply with quantities is all I need.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    r3:
      subject: "Anything change on your end?"
      body: |
        {{ greeting }}

        This is my last note on this. It's been longer than usual since {{ company or "you" }} ordered, so I wanted to check in.

        If you're simply stocked up, no reply needed. If something changed, such as a different process, a problem with the product, or another supplier, a one-line reply would help me a lot.

        And if you do need more, just reply here.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

# ============================================================================ versions by contact type
role_variants:
  # --------------------------------------------------------------- buyer (purchasing; did not use the product)
  buyer:
    e1:
      subject: "Reorder info for your Hunter Products order{% if po_number %} (PO {{ po_number }}){% endif %}"
      body: |
        {{ greeting }}

        Thanks for the order{% if po_number %} on PO {{ po_number }}{% endif %}. Two things that may save you time later.

        {% if products %}
        What was ordered:
        {% for p in products %}
        - {{ p.display }} ({{ p.sku }})

        {% endfor %}
        {% endif %}
        To reorder, reply to this email with part numbers, quantities and a PO. Orders ship the same or next business day.

        Also, if someone else at {{ company or "your company" }} is the one using these, could you forward this to them or send me their name? I have setup and technique notes that will be more useful to them than to purchasing: {{ guides_url if family == "micro_metallizer" else system_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e2:
      skip: true        # technique tips go to users, not purchasing

    e3:
      subject: "{{ family_label }} reorder: part numbers and lead time"
      body: |
        {{ greeting }}

        It's been a couple of months since {{ company or "your team" }}'s first order, so stock may be getting low. Here is everything needed to reorder.

        {% if consumables %}
        Part numbers from the first order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }})

        {% endfor %}
        {% else %}
        Parts and supplies: {{ store_url }}
        {% endif %}
        Lead time: orders ship the same or next business day.
        Terms: payment terms are available on request, and we take ACH.

        Reply with quantities and a PO, or request a formal quote here: {{ quote_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

    e4:
      subject: "{% if family == 'micro_metallizer' %}Blanket PO or volume pricing for {{ company or 'your team' }}{% else %}Parts and supplies for your {{ family_label }}{% endif %}"
      body: |
        {{ greeting }}

        {% if family == "micro_metallizer" %}
        If {{ company or "your team" }} expects to keep using the plating pens, there are two ways to cut the paperwork and the price:

        - A blanket PO with scheduled releases, so pens arrive on a set schedule without a new PO each time.
        - Volume pricing on orders of 50 pens or more.
        {% else %}
        If {{ company or "your team" }} will need parts or supplies for the {{ family_label }} this year, a blanket PO with scheduled releases saves a new PO each time, and I can quote everything on one page.
        {% endif %}

        If {{ "either" if family == "micro_metallizer" else "that" }} is useful, reply with rough annual quantities and I'll send a quote: {{ quote_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

  # --------------------------------------------------------------- owner_operator (one person orders and uses it)
  # Gets the standard emails, except the reorder email leads with the web store instead of a PO.
  owner_operator:
    e3:
      subject: "Restocking {{ family_label }} supplies"
      body: |
        {{ greeting }}

        It's been a couple of months since your first order, so here's the quick way to restock when you need to.

        {% if consumables %}
        From your original order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}
        {% endif %}

        Fastest is the web store: {{ store_url }}
        Or just reply with what you need and I'll set it up.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_address }}
        {{ sender_phone }}

# Tip blocks inserted into e2 by application (A) or product line (B, C).
# A customer buying two metals gets both blocks (max_application_blocks).
blocks: {}
