# Email copy. Jinja2 templates rendered with the customer's real purchase data.
#
# RULES
#  * Anything not confirmed by Hunter Products is written as [[VERIFY: ...]].
#    Live sending of an email that still contains a VERIFY marker is BLOCKED automatically.
#    Run `hunter-retention content-lint` to list what's left.
#  * Part numbers and links below come from the QuickBooks item list and hunterproducts.com (Nov 2026).
#  * No em dashes, no jewelry references, no "made in NJ", no SDS/spec sheet citations.
#  * Never say the order "arrived": QuickBooks has no delivery confirmation.
#
# Variables: greeting, first_name, company, product, product_sku, product_url, products, consumables,
#   application_labels, family_label, system_url, store_url, quote_url, tech_url, resources_url,
#   guides_url, sender_name, sender_title, sender_company, sender_phone, blocks (rendered tip blocks)

greeting_fallback: "Hello,"
max_application_blocks: 2

links:
  quote: "https://hunterproducts.com/contact/#quote"
  technical: "https://hunterproducts.com/contact/?topic=technical#quote"
  resources: "https://hunterproducts.com/resources/"
  guides: "https://hunterproducts.com/guides/"

tracks:
  # ===================================================================== A: Micro-Metallizer
  A:
    e1:
      subject: "Getting started with your {{ product }}"
      body: |
        {{ greeting }}

        Thanks again for ordering the {{ product }}. I wanted to check in as you get started with it.

        One thing that trips people up early: between steps and at the end, wipe the part with a clean cloth. Don't rinse it in water.

        If anything about setup, surface prep or technique isn't clear, just reply to this email. It's usually faster to sort out here than by trial and error on a real part.

        Product page: {{ product_url }}
        Brush plating guides: {{ guides_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e2:
      subject: "{% if application_labels %}A few {{ application_labels | join(' and ') }} plating tips{% else %}A few plating tips{% endif %}"
      body: |
        {{ greeting }}

        It's been about a month since your {{ product }} order, so here are a few notes{% if application_labels %} for {{ application_labels | join(' and ') }} work{% endif %}.

        {% for b in blocks %}
        {{ b }}

        {% endfor %}
        {% if consumables %}
        When you need more, here's what you ordered:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}

        {% endif %}
        Questions on a specific part or substrate? Reply here or send details through {{ tech_url }}.

        Best,
        {{ sender_name }}
        {{ sender_company }}

    e3:
      subject: "Restocking your plating pens"
      body: |
        {{ greeting }}

        It's been a couple of months since your first order, so I wanted to make reordering easy for when you need it.

        {% if consumables %}
        From your original order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}
        {% else %}
        Pens for the {{ product }} are here: {{ store_url }}
        {% endif %}

        Reply with quantities and a PO number and we'll ship same day, or order online at {{ store_url }}. If you need a quote first: {{ quote_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up and see how things have been going with the {{ product }}.

        Have you been getting the results you were looking for?

        If there's anything we can help with, whether it's technique, replacement pens, or a different plating application, just reply and I'll take care of it.

        Best,
        {{ sender_name }}
        {{ sender_company }}

  # ===================================================================== B: Carbitron 300
  B:
    e1:
      subject: "Getting set up with your Carbitron 300"
      body: |
        {{ greeting }}

        Thanks again for ordering the Carbitron 300. I wanted to check in as you get it set up.

        Have you had a chance to run it on a part yet? If anything about setup or operation isn't clear, reply here and tell me what tool or surface you're coating. I'll point you in the right direction.

        System overview: {{ system_url }}
        Documentation: {{ resources_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e2:
      subject: "Carbitron 300 operating tips"
      body: |
        {{ greeting }}

        About a month in with the Carbitron 300, here are a few notes that help get consistent results.

        {% for b in blocks %}
        {{ b }}

        {% endfor %}
        Electrodes come in tungsten carbide (1/32", 1/16", 1/8" and 7/32") and titanium carbide (1/8"). If you're not sure which size fits your work, reply with what you're coating.

        Best,
        {{ sender_name }}
        {{ sender_company }}

    e3:
      subject: "Carbitron 300 electrodes and parts"
      body: |
        {{ greeting }}

        [[VERIFY: one sentence on what to check on the Carbitron 300 after 2 to 3 months of use (hand piece, cables, electrode wear) and how often]]

        {% if consumables %}
        Electrodes from your original order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }})

        {% endfor %}
        {% endif %}
        Replacement parts we stock:
        - Vibrator Hand Piece (TS3042), or with power cable (TS3053)
        - Power Cable, red (TS3045)
        - Ground Cable, black (TS3046)

        Reply with what you need and a PO number and we'll ship same day. Electrodes and parts online: {{ store_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up on the Carbitron 300. How has it been performing for you?

        If you've run into anything, or you're coating something new and want a second opinion on electrodes or setup, just reply. Happy to help.

        Best,
        {{ sender_name }}
        {{ sender_company }}

  # ===================================================================== C: Micro-Jet 200
  C:
    e1:
      subject: "Getting set up with your Micro-Jet 200"
      body: |
        {{ greeting }}

        Thanks again for ordering the Micro-Jet 200. I wanted to check in as you get it set up.

        Have you had a chance to run it yet? If anything about setup, air supply or media isn't clear, reply here and tell me what you're blasting. I'll point you in the right direction.

        System overview: {{ system_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e2:
      subject: "Micro-Jet 200 tips"
      body: |
        {{ greeting }}

        About a month in with the Micro-Jet 200, here are a few notes that help.

        {% for b in blocks %}
        {{ b }}

        {% endfor %}
        Media we stock: aluminum oxide (AB2024, AB2025), silicon carbide (AB2028, AB2029) and glass beads (AB3032). Media page: https://hunterproducts.com/store/?type=media

        Best,
        {{ sender_name }}
        {{ sender_company }}

    e3:
      subject: "Micro-Jet 200 nozzles and media"
      body: |
        {{ greeting }}

        It's been a couple of months since you started with the Micro-Jet 200, so here's the reorder info in one place.

        {% if consumables %}
        From your original order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }})

        {% endfor %}
        {% endif %}
        Nozzles: Nozzle Assembly .020" (AB2001), Tungsten Carbide Nozzle Assembly .030" (AB2002), Tungsten Carbide Nozzle .020" (AB2003)
        [[VERIFY: when a nozzle should be replaced (sign of wear) for the Micro-Jet 200]]

        Reply with what you need and a PO number and we'll ship same day, or order online: {{ store_url }}

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up on the Micro-Jet 200. How has it been working for you?

        If you've hit any issues, or you're trying a new media or part, just reply. Happy to help.

        Best,
        {{ sender_name }}
        {{ sender_company }}

  # ===================================================================== D: Consumables / parts only
  D:
    e1:
      subject: "Your Hunter Products order"
      body: |
        {{ greeting }}

        Thanks for ordering the {{ product }} from us. Quick question so we can help going forward: which {{ family_label }} system are you running these with, and roughly how long has it been in service?

        If you need anything for it, parts, technique help, or a quote, just reply here.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e3:
      subject: "Restocking {{ family_label }} supplies"
      body: |
        {{ greeting }}

        It's been a couple of months since your order, so I wanted to make the next one easy.

        {% if consumables %}
        From your last order:
        {% for c in consumables %}
        - {{ c.display }} ({{ c.sku }}){% if c.url %}: {{ c.url }}{% endif %}

        {% endfor %}
        {% endif %}
        Reply with quantities and a PO number and we'll ship same day, or order online at {{ store_url }}.

        Best,
        {{ sender_name }}
        {{ sender_company }}
        {{ sender_phone }}

    e4:
      subject: "Checking in"
      body: |
        {{ greeting }}

        I wanted to personally follow up and see how things are going with your {{ family_label }} work.

        If there's anything we can help with, parts, technique, or something new you're working on, just reply and I'll take care of it.

        Best,
        {{ sender_name }}
        {{ sender_company }}

# Tip blocks inserted into e2 by application (A) or product line (B, C).
# A customer buying two metals gets both blocks (max_application_blocks).
blocks:
  A:
    e2:
      gold: |
        Gold:
        - Gold over copper or brass usually needs a nickel barrier underneath. [[VERIFY: confirm Hunter recommends nickel first under gold, and when it can be skipped]]
        - [[VERIFY: gold tip, e.g. prep sequence with the absorbent/degreaser pen before gold]]
        - [[VERIFY: when to use the 24K Gold Heavy Duty pen (PL-1016) instead of the standard 24K pen (PL-1003)]]
      nickel: |
        Nickel:
        - Nickel is commonly used as a barrier layer, for example under gold on contacts.
        - [[VERIFY: nickel tip, e.g. prep and stroke technique for an even deposit]]
        - [[VERIFY: when to use black nickel (PL-1007) or nickel heavy duty (PL-1020)]]
      tin: |
        Tin:
        - Tin pens are used to restore solderability on pads and leads.
        - [[VERIFY: tin tip, e.g. surface prep before tin and how to check coverage]]
      silver: |
        Silver:
        - [[VERIFY: silver tip 1 (typical use and prep)]]
        - [[VERIFY: silver tip 2 (when to use Silver Heavy Duty PL-1018)]]
      copper: |
        Copper:
        - [[VERIFY: copper tip 1 (typical use, e.g. trace or pad build-up, and prep)]]
        - [[VERIFY: copper tip 2 (when to use Copper Heavy Duty PL-1019)]]
      other: |
        - [[VERIFY: tips for specialty pens (rhodium, palladium, zinc, chrome color)]]
      general: |
        - Prep matters most. Start with a clean, degreased surface; the absorbent/degreaser pen (PL-1002) is made for that step.
        - Wipe with a clean cloth between steps and at the end. Don't rinse in water.
        - [[VERIFY: one more general Micro-Metallizer technique tip]]
  B:
    e2:
      carbitron: |
        - [[VERIFY: Carbitron tip 1, e.g. surface prep before applying tungsten carbide]]
        - [[VERIFY: Carbitron tip 2, e.g. power/vibration settings for small vs large areas]]
        - [[VERIFY: Carbitron tip 3, e.g. how to tell when an electrode needs replacing]]
  C:
    e2:
      micro_jet: |
        - [[VERIFY: Micro-Jet tip 1, e.g. air supply requirements (dry, filtered air)]]
        - [[VERIFY: Micro-Jet tip 2, e.g. matching media type and grit to the job]]
        - [[VERIFY: Micro-Jet tip 3, e.g. nozzle distance and angle]]
