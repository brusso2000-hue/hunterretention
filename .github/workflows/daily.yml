name: hunter-retention-daily

on:
  schedule:
    # 11:41 UTC = 6:41am ET in winter / 7:41am ET in summer. Apollo then sends inside its own schedule window.
    - cron: "41 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Override mode for this run (leave blank to use settings.yaml)"
        required: false
        type: choice
        options: ["", "dry_run", "sandbox", "live"]
      full_sync:
        description: "Force a full QuickBooks re-sync"
        required: false
        type: boolean
      contacts_preview_days:
        description: "Also write a contact-lookup preview for buyers from the last N days (writes nothing, 0 credits)"
        required: false
        type: string

# Never let two runs overlap (idempotency relies on one writer at a time).
concurrency:
  group: hunter-retention
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[postgres,crypto]"
      - name: Daily run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REALM_ID: ${{ secrets.QBO_REALM_ID }}
          # One-time bootstrap: used only while the database has no token yet; after that the rotating token lives in Postgres.
          QBO_REFRESH_TOKEN: ${{ secrets.QBO_REFRESH_TOKEN }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          HP_TOKEN_KEY: ${{ secrets.HP_TOKEN_KEY }}
          # Second key for live email. Set the repository VARIABLE HP_ALLOW_LIVE_SEND=true only at go-live.
          HP_ALLOW_LIVE_SEND: ${{ vars.HP_ALLOW_LIVE_SEND }}
          HP_MODE: ${{ inputs.mode }}
          # Read-only Outlook search for the contact lookup (optional; the lookup skips the inbox step without it).
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          PREVIEW_DAYS: ${{ inputs.contacts_preview_days }}
        run: |
          ARGS=""
          if [ "${{ inputs.full_sync }}" = "true" ]; then ARGS="--full-sync"; fi
          # "simulate:N" is a self-contained what-if run: it never writes to the database, so skip the real run.
          # One-off setup helpers. Neither runs the daily job.
          #   setup-apollo      create/find the Apollo custom fields and store their ids
          #   test-send:SET[:FORMAT]  sample emails to our own inbox only (SET = smoke | core | all, FORMAT = text | html | both)
          case "$PREVIEW_DAYS" in
            setup-apollo) hunter-retention setup-apollo --create; exit 0;;
            alert-test) hunter-retention alert-test; exit 0;;
            test-send:*) IFS=: read -r _ SET FMT <<< "$PREVIEW_DAYS"; hunter-retention test-send --set "$SET" ${FMT:+--format "$FMT"}; exit 0;;
          esac
          case "$PREVIEW_DAYS" in simulate:*) hunter-retention simulate --days-back "${PREVIEW_DAYS#simulate:}"; exit 0;; esac
          hunter-retention run $ARGS
          if [ "$PREVIEW_DAYS" = "mailcheck" ]; then hunter-retention contacts mailcheck || true
          elif [ -n "$PREVIEW_DAYS" ]; then hunter-retention contacts preview --days "$PREVIEW_DAYS" --max-accounts 110; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]" && pytest -q
