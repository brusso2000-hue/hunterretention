name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest -q
      - name: Product table check (fails if config breaks)
        run: python -c "from hunter_retention.config import load_config; from hunter_retention.classify import Classifier; c=load_config(); Classifier(c.products, c.lifecycle); print('ok')"
