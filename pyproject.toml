[project]
name = "hunter-retention"
version = "1.0.0"
description = "QuickBooks -> Apollo first-time customer retention and reorder automation for Hunter Products"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "requests>=2.31",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
crypto = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
hunter-retention = "hunter_retention.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
